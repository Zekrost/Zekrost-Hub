<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kora Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1b2a4a;
      color: #eef4fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      user-select: none;
    }
    .box { text-align: center; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #1b2a4a, #00b4d8);
      border-radius: 14px;
      display: grid; place-items: center;
      color: #fff; font-size: 26px; font-weight: 800;
      box-shadow: 0 8px 28px rgba(0, 180, 216, 0.35);
    }
    h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin-top: 8px; color: #b6c6da; font-size: 13px; }
    .spinner {
      width: 16px; height: 16px; margin: 18px auto 0;
      border-radius: 50%;
      border: 2px solid #2a3f63;
      border-top-color: #00b4d8;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">K</div>
    <h1>Kora Hub</h1>
    <p>Iniciando el workspace local…</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
