<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kora Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f8f9fa;
      color: #1b2a4a;
      font-family: "Poppins", "Inter", system-ui, sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      user-select: none;
    }
    .box { text-align: center; }
    .mark {
      width: 88px; height: 88px; margin: 0 auto 20px;
      background: #fff;
      border-radius: 22px;
      display: grid; place-items: center;
      box-shadow: 0 8px 28px rgba(27, 42, 74, 0.12);
      overflow: hidden;
    }
    .mark img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    p { margin-top: 8px; color: #46597a; font-size: 13px; }
    .spinner {
      width: 16px; height: 16px; margin: 20px auto 0;
      border-radius: 50%;
      border: 2px solid #d5dde7;
      border-top-color: #00b4d8;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark"><img src="kora-hub-logo.png" alt="Kora Hub" /></div>
    <h1>Kora Hub</h1>
    <p>Iniciando el workspace local…</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
