name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install sqlc
        run: |
          curl -fsSL -o sqlc.tar.gz "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz"
          tar -xzf sqlc.tar.gz sqlc
          sudo mv sqlc /usr/local/bin/
          sqlc version

      - name: Frontend deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Frontend tests + build
        working-directory: web
        run: |
          npx vitest run
          npm run build

      - name: Embed frontend + Go vet
        run: |
          rm -rf internal/web/dist && cp -r web/dist internal/web/dist
          go vet ./...

      - name: sqlc generate (diff check)
        run: |
          sqlc generate
          git diff --exit-code -- internal/db || (echo "código sqlc desactualizado" && exit 1)

      - name: Go tests
        run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install sqlc
        run: |
          curl -fsSL -o sqlc.tar.gz "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz"
          tar -xzf sqlc.tar.gz sqlc
          sudo mv sqlc /usr/local/bin/
          sqlc version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: GoReleaser
        run: |
          set +e
          goreleaser release --clean > /tmp/goreleaser.log 2>&1
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            tail -60 /tmp/goreleaser.log
            python3 -c "import sys;[print('::error::'+l.replace('%','%25').replace(chr(10),'%0A').replace(chr(13),'%0D')) for l in open('/tmp/goreleaser.log').read().splitlines()[-40:]]"
          fi
          exit $EXIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
